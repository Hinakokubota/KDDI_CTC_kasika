<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDDI-CTC 組織構造</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <div class="header-left">
                <div class="logo-icon">
                    <div class="logo-icon-half-l"></div>
                    <div class="logo-icon-half-r"></div>
                </div>
                <h1 class="header-title">KDDI-CTC 組織構造</h1>
            </div>
            <!-- ▼▼▼ ビュー切替ボタン（Full復活時はコメント解除・active付け替え）▼▼▼ -->
            <div class="view-toggle">
                <!-- <button id="full-view-btn" class="view-btn">組織全体 (Full)</button> -->
                <button id="full-view-btn" class="view-btn" style="display:none;"></button>
                <button id="personal-view-btn" class="view-btn active">担当者連携 (Connect)</button>
            </div>
            <!-- ▲▲▲ ビュー切替ボタン ここまで -->
        </header>
        <!-- フィルターエリア -->
        <div class="filter-area">
            <!-- ▼▼▼ 絞り込みフィルター行（データ準備後に復活予定 - コメントアウト中）▼▼▼
            <div class="filter-row">
                <span class="filter-label">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1 2h10M3 6h6M5 10h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    絞り込みフィルター
                </span>
                <div class="divider-v"></div>
                <div class="filter-group">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="1" width="10" height="10" rx="2" stroke="currentColor" stroke-width="1.2"/><path d="M4 1v10M8 1v10M1 5h10" stroke="currentColor" stroke-width="0.9"/></svg>
                    <label for="date-filter">期間：</label>
                    <select id="date-filter" class="filter-select">
                        <option value="">全期間</option>
                        <option value="1year" selected>1年以内</option>
                        <option value="6months">6ヶ月以内</option>
                        <option value="3months">3ヶ月以内</option>
                    </select>
                </div>
                <div class="divider-v"></div>
                <div class="filter-group">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="4" r="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M1.5 10.5c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                    <label for="position-filter">役職：</label>
                    <select id="position-filter" class="filter-select">
                        <option value="">全て</option>
                        <option value="副本部長理事">副本部長理事</option>
                        <option value="副本部長">副本部長</option>
                        <option value="課長補佐">課長補佐</option>
                        <option value="none">役職なし</option>
                    </select>
                </div>
                <button id="clear-search-button" class="clear-link">条件クリア</button>
            </div>
            ▲▲▲ 絞り込みフィルター行 ここまで -->

            <!-- キーワード検索行 -->
            <div class="search-row">
                <span class="search-label">
                    <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                        <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
                        <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                    </svg>
                    キーワード検索：
                </span>
                <div class="search-input-wrap">
                    <input type="text" id="keyword-input" class="search-input" placeholder="部署・氏名を入力...">
                    <input type="hidden" id="scope-select" value="both">
                    <input type="hidden" id="company-select" value="both">
                </div>
                <button id="cancel-search-button" class="cancel-btn">
                    <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                    検索解除
                </button>
                <button id="search-button" class="search-btn">検索</button>
            </div>
        </div>

        <!-- メインエリア: 組織図表示 -->
        <main class="main-area">
            <div class="org-container">
                <!-- 左ペイン: KDDI組織図 -->
                <div class="org-panel kddi-panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <h2>KDDI</h2>
                        </div>
                        <div class="panel-actions" id="kddi-panel-actions" style="display: none;">
                            <button class="panel-select-btn select-all" onclick="selectAllPersonsInPanel('kddi')">全選択</button>
                            <button class="panel-select-btn deselect-all" onclick="deselectAllPersonsInPanel('kddi')">全解除</button>
                        </div>
                    </div>
                    <div id="kddi-tree" class="org-tree"></div>
                </div>

                <!-- 中央: コネクタ線描画エリア -->
                <svg id="connector-svg" class="connector-layer">
                </svg>

                <!-- 右ペイン: CTC組織図 -->
                <div class="org-panel ctc-panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <h2>CTC</h2>
                        </div>
                        <div class="panel-actions" id="ctc-panel-actions" style="display: none;">
                            <button class="panel-select-btn select-all" onclick="selectAllPersonsInPanel('ctc')">全選択</button>
                            <button class="panel-select-btn deselect-all" onclick="deselectAllPersonsInPanel('ctc')">全解除</button>
                        </div>
                    </div>
                    <div id="ctc-tree" class="org-tree"></div>
                </div>
            </div>
        </main>

        <!-- ヒートマップエリア -->
        <section class="heatmap-section">
            <div class="heatmap-header">
                <h2 class="heatmap-title">
                    <span class="kddi-color">KDDI</span>×<span class="ctc-color">CTC</span> 組織相関ヒートマップ
                </h2>
                <!-- 凡例をタイトルの横に配置 -->
                <div class="heatmap-legend">
                    <span class="legend-label">接続件数:</span>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #F4F6FA;"></span>
                        <span>0件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: rgba(0,92,202,0.12);"></span>
                        <span>1-10件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: rgba(0,92,202,0.30);"></span>
                        <span>11-20件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: rgba(0,92,202,0.55); color: #fff;">
                            <span style="background: rgba(0,92,202,0.55); padding: 2px 8px; border-radius: 3px;">21-30件</span>
                        </span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: rgb(14,13,106); color: #fff;">
                            <span style="background: rgb(14,13,106); padding: 2px 8px; border-radius: 3px;">31件以上</span>
                        </span>
                    </div>
                </div>
            </div>
            <div class="heatmap-container">
                <div id="heatmap-grid"></div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
    <script src="heatmap.js"></script>
</body>
</html>
