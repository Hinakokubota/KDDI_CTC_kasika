<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDDI-CTC 組織構造</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ヘッダーエリア: 検索・フィルタリング機能 -->
        <header class="header">
            <h1>KDDI-CTC 組織構造</h1>
            <div class="search-controls">
                <div class="control-group">
                    <label for="company-select">会社名:</label>
                    <select id="company-select">
                        <option value="KDDI">KDDI</option>
                        <option value="CTC">CTC</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="scope-select">検索対象:</label>
                    <select id="scope-select">
                        <option value="department">部署</option>
                        <option value="person">個人名</option>
                    </select>
                </div>

                <div class="control-group">
                    <input type="text" id="keyword-input" placeholder="キーワードを入力...">
                </div>

                <div class="control-group">
                    <label for="position-filter">役職:</label>
                    <select id="position-filter">
                        <option value="">すべて</option>
                        <option value="副本部長理事">副本部長理事</option>
                        <option value="副本部長">副本部長</option>
                        <option value="課長補佐">課長補佐</option>
                        <option value="none">役職なし</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="date-filter">接点日:</label>
                    <input type="month" id="date-filter" placeholder="YYYY/MM">
                </div>

                <div class="search-actions">
                    <button id="search-button" class="search-btn">検索</button>
                    <button id="clear-search-button" class="search-btn clear-btn">検索解除</button>
                </div>

                <div class="view-toggle">
                    <button id="full-view-btn" class="view-btn active">Full View</button>
                    <button id="personal-view-btn" class="view-btn">個人View</button>
                </div>
            </div>
        </header>

        <!-- メインエリア: 組織図表示 -->
        <main class="main-area">
            <div class="org-container">
                <!-- 左ペイン: KDDI組織図 -->
                <div class="org-panel kddi-panel">
                    <div class="panel-header">
                        <h2>KDDI <span class="default-note">(Default: Headquarters)</span></h2>
                    </div>
                    <div id="kddi-tree" class="org-tree"></div>
                </div>

                <!-- 中央: コネクタ線描画エリア -->
                <svg id="connector-svg" class="connector-layer">
                </svg>

                <!-- 右ペイン: CTC組織図 -->
                <div class="org-panel ctc-panel">
                    <div class="panel-header">
                        <h2>CTC <span class="default-note">(Default: Department)</span></h2>
                    </div>
                    <div id="ctc-tree" class="org-tree"></div>
                </div>
            </div>
        </main>

        <!-- ヒートマップエリア -->
        <section class="heatmap-section">
            <h2 class="heatmap-title">KDDI・CTC 組織相関ヒートマップ</h2>
            <div class="heatmap-controls">
                <div class="legend">
                    <span class="legend-label">接続件数:</span>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #f0f0f0;"></span>
                        <span>0件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #cfe2f3;"></span>
                        <span>1-2件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #6fa8dc;"></span>
                        <span>3-5件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #3c78d8;"></span>
                        <span>6-10件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #1155cc;"></span>
                        <span>11件以上</span>
                    </div>
                </div>
            </div>
            <div class="heatmap-container">
                <div id="heatmap-grid"></div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
    <script src="heatmap.js"></script>
</body>
</html>
