<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDDI-CTC 組織構造</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <h1>KDDI-CTC 組織構造</h1>
            <div class="view-toggle">
                <button id="full-view-btn" class="view-btn active">組織全体 (Full)</button>
                <button id="personal-view-btn" class="view-btn">担当者連携 (Connect)</button>
            </div>
        </header>

        <!-- フィルターエリア -->
        <div class="filter-area">
            <!-- 絞り込みフィルター行 -->
            <div class="filter-row">
                <span class="filter-label">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 3h14M3 8h10M6 13h4" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg>
                    絞り込みフィルター:
                </span>
                <div class="filter-group">
                    <span class="filter-icon">📅</span>
                    <label for="date-filter">期間：</label>
                    <select id="date-filter" class="filter-select">
                        <option value="">全期間</option>
                        <option value="1year" selected>1年以内</option>
                        <option value="6months">6ヶ月以内</option>
                        <option value="3months">3ヶ月以内</option>
                    </select>
                </div>
                <div class="filter-group">
                    <span class="filter-icon">👤</span>
                    <label for="position-filter">役職：</label>
                    <select id="position-filter" class="filter-select">
                        <option value="">全て</option>
                        <option value="副本部長理事">副本部長理事</option>
                        <option value="副本部長">副本部長</option>
                        <option value="課長補佐">課長補佐</option>
                        <option value="none">役職なし</option>
                    </select>
                </div>
                <button id="clear-search-button" class="clear-link">条件クリア</button>
            </div>

            <!-- キーワード検索行 -->
            <div class="search-row">
                <span class="search-label">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="6.5" cy="6.5" r="5" stroke="#555" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="#555" stroke-width="1.5" stroke-linecap="round"/></svg>
                    キーワード検索:
                </span>
                <div class="search-input-wrap">
                    <input type="text" id="keyword-input" class="search-input" placeholder="部署・氏名を入力...">
                    <!-- 検索対象（hidden） -->
                    <input type="hidden" id="scope-select" value="department">
                    <input type="hidden" id="company-select" value="KDDI">
                </div>
                <button id="cancel-search-button" class="cancel-btn">
                    <span>×</span> 検索解除
                </button>
                <button id="search-button" class="search-btn">検索</button>
            </div>
        </div>

        <!-- メインエリア: 組織図表示 -->
        <main class="main-area">
            <div class="org-container">
                <!-- 左ペイン: KDDI組織図 -->
                <div class="org-panel kddi-panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <h2>KDDI <span class="default-note">(Default: Headquarters)</span></h2>
                        </div>
                        <div class="panel-actions" id="kddi-panel-actions" style="display: none;">
                            <button class="panel-select-btn select-all" onclick="selectAllPersonsInPanel('kddi')">全選択</button>
                            <button class="panel-select-btn deselect-all" onclick="deselectAllPersonsInPanel('kddi')">全解除</button>
                        </div>
                    </div>
                    <div id="kddi-tree" class="org-tree"></div>
                </div>

                <!-- 中央: コネクタ線描画エリア -->
                <svg id="connector-svg" class="connector-layer">
                </svg>

                <!-- 右ペイン: CTC組織図 -->
                <div class="org-panel ctc-panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <h2>CTC <span class="default-note">(Default: Department)</span></h2>
                        </div>
                        <div class="panel-actions" id="ctc-panel-actions" style="display: none;">
                            <button class="panel-select-btn select-all" onclick="selectAllPersonsInPanel('ctc')">全選択</button>
                            <button class="panel-select-btn deselect-all" onclick="deselectAllPersonsInPanel('ctc')">全解除</button>
                        </div>
                    </div>
                    <div id="ctc-tree" class="org-tree"></div>
                </div>
            </div>
        </main>

        <!-- ヒートマップエリア -->
        <section class="heatmap-section">
            <h2 class="heatmap-title">KDDI・CTC 組織相関ヒートマップ</h2>
            <div class="heatmap-controls">
                <div class="legend">
                    <span class="legend-label">接続件数:</span>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #f0f0f0;"></span>
                        <span>0件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #cfe2f3;"></span>
                        <span>1-2件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #6fa8dc;"></span>
                        <span>3-5件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #3c78d8;"></span>
                        <span>6-10件</span>
                    </div>
                    <div class="legend-item">
                        <span class="legend-color" style="background: #1155cc;"></span>
                        <span>11件以上</span>
                    </div>
                </div>
            </div>
            <div class="heatmap-container">
                <div id="heatmap-grid"></div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
    <script src="heatmap.js"></script>
</body>
</html>
